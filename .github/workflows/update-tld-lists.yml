name: Update TLD lists

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Update Netcraft list
        run: python scripts/update_netcraft_tlds.py netcraft-tlds.csv README.md
      - name: Update Spamhaus list
        if: always()   # still run if the Netcraft step failed
        run: python scripts/update_spamhaus_tlds.py spamhaus-abused-tlds.csv README.md
      - name: Commit if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain netcraft-tlds.csv spamhaus-abused-tlds.csv README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add netcraft-tlds.csv spamhaus-abused-tlds.csv README.md
            git commit -m "Auto-update TLD lists and README dates"
            git push
          else
            echo "No changes"
          fi
